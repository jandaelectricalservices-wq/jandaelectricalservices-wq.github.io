<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your quotation · J&amp;A Electrical Installation Services</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080C16;--panel:#111A2C;--line:#243150;--ink:#F3F5F9;--muted:#9AA3B5;--amber:#FAA819;--good:#2FBF71;--bad:#F2615A;
  --paper:#FBFAF7;--pink:#111827;--pline:#E3DFD6;--pmuted:#5B6474;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--amber)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top{border-bottom:1px solid var(--line);background:#0B111E}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:72px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.brand img{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px}
.brand b{font-family:var(--f-display);font-size:21px;letter-spacing:.02em;text-transform:uppercase;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px}
.call{font-family:var(--f-mono);font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
main.wrap{padding-top:32px;padding-bottom:120px}
.mq{display:none;color:#5b6474;font-size:13px}
.hello h1{font-family:var(--f-display);font-size:clamp(30px,6vw,42px);text-transform:uppercase;line-height:1.05;letter-spacing:.01em}
.hello p{color:var(--muted);margin-top:8px;max-width:620px}
.banner{margin-top:18px;border-radius:10px;padding:14px 16px;font-size:15px;border:1px solid}
.banner.good{background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.45)}
.banner.bad{background:rgba(242,97,90,.1);border-color:rgba(242,97,90,.45)}
.banner b{display:block}
.paper{margin-top:20px;background:var(--paper);color:var(--pink);border-radius:12px;padding:clamp(18px,4vw,34px);font-size:14.5px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.phead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--pink);padding-bottom:14px}
.phead h2{font-family:var(--f-display);font-size:24px;text-transform:uppercase;line-height:1.1}
.phead .r{text-align:right}
.phead .r b{font-family:var(--f-display);font-size:26px;letter-spacing:.04em}
.m{color:var(--pmuted);font-size:13px}
.to{margin-top:16px;display:grid;gap:2px}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{padding:9px 6px;border-bottom:1px solid var(--pline);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--pmuted);font-weight:600}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sums{margin-left:auto;max-width:340px;margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:6px 18px}
.total{border-top:2px solid var(--pink);padding-top:8px;font-family:var(--f-display);font-size:24px;text-transform:uppercase}
h3{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin-top:22px}
.notes{margin-top:10px;white-space:pre-wrap}
.fine{margin-top:18px;color:var(--pmuted);font-size:12.5px}
.accept{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
.accept h2{font-family:var(--f-display);font-size:24px;text-transform:uppercase}
label.f{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;color:var(--ink);background:#0B111E;border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px}
input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 16px var(--f-body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#0B111E}
.btn[disabled]{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px}
.help{margin-top:20px;color:var(--muted);font-size:14px}
.skel{margin-top:20px;height:420px;border-radius:12px;background:linear-gradient(90deg,#111A2C,#16213a,#111A2C);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
@media (max-width:560px){.phead .r{text-align:left}th:nth-child(2),td:nth-child(2){display:none}.mq{display:inline}.top .wrap{height:64px}.brand img{width:38px;height:38px}.brand b{font-size:18px}}
@media print{@page{margin:12mm}html,body{background:#fff;color:#000}.top,.hello,.accept,.help,.banner,.noprint{display:none!important}main.wrap{padding:0}.wrap{max-width:none;padding:0}.paper{box-shadow:none;margin:0;padding:0;background:#fff}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/"><img src="/icon-512.png" alt=""><span><b>J&amp;A Electrical</b><small>Installation Services</small></span></a><a class="call" href="tel:09151120470">0915-112-0470</a></div></header>
<main class="wrap" id="app"><div class="skel" aria-label="Loading your quotation"></div></main>
<script>
const JA_API={url:"https://zdogdfcawlandwllawex.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpkb2dkZmNhd2xhbmR3bGxhd2V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5Nzg4NjYsImV4cCI6MjExMDU1NDg2Nn0.Ey_BGsnOc5wlD81S8ivmFsCn56-Lym-6fB8Q3y9hK-4"};
const app=document.getElementById('app');
const token=new URLSearchParams(location.search).get('t')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const peso=n=>'₱'+Math.round(+n||0).toLocaleString('en-PH');
const day=s=>{if(!s)return '';const p=String(s).slice(0,10).split('-');const d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d)?String(s):d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})};
const today=()=>{const d=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)};
async function rpc(fn,body){const r=await fetch(JA_API.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:JA_API.key,Authorization:'Bearer '+JA_API.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&j.message)||'Something went wrong. Please call 0915-112-0470.');return j}
const contact=`<p class="help">Questions or changes? Call or text <a href="tel:09151120470">0915-112-0470</a>, <a href="https://m.me/61591375948574" target="_blank" rel="noopener">message us on Messenger</a>, or email <a href="mailto:jandaelectricalservices@gmail.com">jandaelectricalservices@gmail.com</a>.</p>`;
function invalid(msg){document.title='Quotation not found · J&A Electrical';app.innerHTML=`<div class="hello"><h1>We couldn't open this quotation</h1><p>${esc(msg||'The link may be incomplete, or J&A may have sent you a newer quotation. Please use the latest email from J&A.')}</p></div>${contact}`}
function render(q){const accepted=q.status==='accepted';const expired=!accepted&&q.validUntil&&q.validUntil<today();
  document.title='Quotation '+(q.no||'')+' · J&A Electrical';
  const rows=(q.rows||[]).map(r=>`<tr><td>${esc(r[0])}<span class="mq"><br>Qty ${esc(r[1])}</span></td><td class="num">${esc(r[1])}</td><td class="num">${peso(r[2])}</td><td class="num">${peso(r[3])}</td></tr>`).join('');
  const terms=(q.terms||[]).map(t=>`<tr><td>${esc(t[0])} (${esc(t[1])}%)</td><td>${esc(t[2])}</td><td class="num">${peso(t[3])}</td></tr>`).join('');
  app.innerHTML=`<div class="hello"><h1>Your quotation</h1><p>Hi ${esc((q.contact||q.client||'').trim())}, here is your quotation from J&amp;A Electrical${q.service?' for '+esc(q.service):''}. Review it, save a copy, and accept it below when you're ready.</p></div>
  ${accepted?`<div class="banner good"><b>Accepted on ${esc(day(q.acceptedAt))} by ${esc(q.acceptedBy)}</b>Thank you! J&amp;A will call you to confirm the schedule and the downpayment.</div>`:''}
  ${expired?`<div class="banner bad"><b>This quotation expired on ${esc(day(q.validUntil))}</b>Prices may have changed. Please call 0915-112-0470 and we'll send you an updated quotation.</div>`:''}
  <article class="paper" aria-label="Quotation ${esc(q.no)}">
   <div class="phead"><div><h2>J&amp;A Electrical Installation Services</h2><div class="m">2937 King Solomon Street, Manila<br>0915-112-0470 · jandaelectricalservices@gmail.com</div></div>
    <div class="r"><b>QUOTATION</b><div class="m">No. ${esc(q.no)}<br>Date: ${esc(day(q.date))}<br>Valid until: ${esc(day(q.validUntil))}</div></div></div>
   <div class="to"><span class="m">Prepared for</span><b>${esc(q.client)}</b><span>${q.contact&&q.contact!==q.client?'Attn: '+esc(q.contact):''}${q.city&&q.city!=='—'?(q.contact&&q.contact!==q.client?' · ':'')+esc(q.city):''}</span>${q.service?`<span class="m">Work: ${esc(q.service)}</span>`:''}</div>
   <table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table>
   <div class="sums"><span>Subtotal</span><span class="num">${peso(q.sub)}</span>${q.vatRate?`<span>VAT ${esc(q.vatRate)}%</span><span class="num">${peso(q.vat)}</span>`:''}<span class="total">Total</span><span class="total num">${peso(q.total)}</span></div>
   ${terms?`<h3>Payment terms</h3><table><tbody>${terms}</tbody></table>`:''}
   ${q.notes?`<h3>Notes</h3><p class="notes">${esc(q.notes)}</p>`:''}
   <p class="fine">${q.vatRate?'Prices include 12% VAT. ':''}Work is led by Engr. John Michael Burgos, Registered Electrical Engineer, with a 1-year service warranty on covered workmanship, subject to terms. Final quantities are confirmed during the ocular inspection.</p>
  </article>
  <div class="row noprint" style="margin-top:16px"><button class="btn" type="button" id="pdf">Save as PDF / Print</button></div>
  ${accepted||expired?'':`<form class="accept" id="acc" novalidate><h2>Accept this quotation</h2>
    <label class="f">Your full name<input type="text" id="who" autocomplete="name" maxlength="80" placeholder="e.g. Juan Dela Cruz"></label>
    <label class="chk"><input type="checkbox" id="ok"> <span>I accept quotation ${esc(q.no)} for ${peso(q.total)} and its payment terms.</span></label>
    <p class="err" id="err" hidden></p>
    <div class="row"><button class="btn primary" type="submit" id="go">Accept quotation</button></div>
    <p style="color:var(--muted);font-size:13.5px">J&amp;A is notified right away and will call you to confirm the schedule. You can still ask questions before work starts.</p></form>`}
  ${contact}`;
  document.getElementById('pdf').onclick=()=>window.print();
  const f=document.getElementById('acc');
  if(f)f.onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err'),go=document.getElementById('go');const who=document.getElementById('who').value.trim();
    const fail=m=>{err.textContent=m;err.hidden=false;go.disabled=false;go.textContent='Accept quotation'};
    if(who.length<2)return fail('Please type your full name.');if(!document.getElementById('ok').checked)return fail('Please tick the box to confirm.');
    go.disabled=true;go.textContent='Sending…';err.hidden=true;
    try{await rpc('accept_quote',{t:token,who});const q2=await rpc('get_quote',{t:token});if(q2){render(q2);window.scrollTo({top:0,behavior:'smooth'})}}catch(x){fail(x.message)}};
}
(async()=>{if(token.length<24)return invalid('This link is incomplete. Please open the link from J&A\'s email again.');
  try{const q=await rpc('get_quote',{t:token});if(!q)return invalid();render(q)}catch(e){invalid(e.message)}})();
</script>
</body>
</html>
